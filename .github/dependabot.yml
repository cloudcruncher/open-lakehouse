# Keep dependencies moving in small, reviewable PRs. CI + e2e must pass to merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: uv
    directory: /services/platform
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"], update-types: [minor, patch] } }
  - package-ecosystem: docker
    directories: [/services/platform, /services/orchestrator, /jobs/spark]
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    # The admin tool writes the catalog schema: it must match the server (1.8.0's bootstrap exits 3 on 1.7.0).
    groups: { polaris: { patterns: ["apache/polaris", "apache/polaris-admin-tool"] } }
    # Tenant images are pinned in tenants/*.yaml and compose.yaml is rendered from it: a bump here
    # edits the generated file and fails lint. Bump the tenant file and run `make tenants-render`.
    ignore:
      - { dependency-name: "cloudcruncher/lakehouse-*" }
      # Major Postgres upgrades need pg_upgrade or a dump and restore, not a tag bump.
      - { dependency-name: "postgres", update-types: ["version-update:semver-major"] }
