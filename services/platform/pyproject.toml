[project]
name = "lakehouse-platform"
version = "0.1.0"
description = "Bootstrap, seeding, and the governed MCP data gateway for the open lakehouse"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.14",
    "anthropic>=1.8",
    "faker>=37",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "mcp==2.2.0",
    "prometheus-client>=0.26",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6",
    "tenacity>=9",
    "trino>=0.340",
]

[project.scripts]
polaris-bootstrap = "lakehouse_platform.bootstrap.polaris:main"
keycloak-reconcile = "lakehouse_platform.bootstrap.keycloak:main"
tenant-reconcile = "lakehouse_platform.bootstrap.tenants:main"
tenant-metrics = "lakehouse_platform.tenant_metrics:main"
cdc-connector = "lakehouse_platform.bootstrap.cdc:main"
seed-corebank = "lakehouse_platform.seed.corebank:main"
mcp-gateway = "lakehouse_platform.mcp_server.server:main"
call-assist = "lakehouse_platform.call_assist.app:main"
call-sim = "lakehouse_platform.call_sim.app:main"
call-assist-evals = "lakehouse_platform.call_assist.evals.run:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse_platform"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"src/lakehouse_platform/seed/*" = ["S311"]  # synthetic data, not crypto
# Colleague-facing guidance text and intent patterns read better unbroken.
"src/lakehouse_platform/call_assist/{engine,signals}.py" = ["E501"]
"src/lakehouse_platform/call_sim/*" = ["E501", "S311"]  # SQL literals; demo ids, not crypto

[tool.pytest.ini_options]
testpaths = ["tests"]
