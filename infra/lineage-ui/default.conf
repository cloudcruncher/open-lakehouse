# Lineage UI (Marquez) behind Keycloak sign-in. nginx forwards the request path untouched and
# asks oauth2-proxy (lineage-sso) only whether the browser is signed in (auth_request).
# oauth2-proxy can't be the reverse proxy here: it decodes and cleans paths, so the UI's
# /api/v1/namespaces/http%3A%2F%2Fpolaris... became a 301 to /namespaces/http:/polaris... and a
# 404 (oauth2-proxy#844). OpenLineage namespaces are URIs, so every dataset page hit it.
server {
    listen 8080;
    absolute_redirect off;   # published on 3003, not 8080: redirects stay relative
    # Browsers send every localhost portal's cookies (SSO sessions, Superset, Grafana).
    large_client_header_buffers 4 64k;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;

    location /oauth2/ {
        proxy_pass http://lineage-sso:4180;
        proxy_set_header Host $http_host;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass http://lineage-sso:4180;
        proxy_set_header Host $http_host;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = @sign_in;
        # No URI after the upstream: the request URI goes through exactly as the browser sent it.
        proxy_pass http://marquez-web:3000;
        proxy_set_header Host $http_host;
    }

    location @sign_in {
        return 302 /oauth2/start?rd=$request_uri;
    }
}
