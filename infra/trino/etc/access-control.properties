# Every authorization decision is delegated to OPA. If OPA is unreachable, Trino
# fails closed: queries are denied, never silently allowed.
access-control.name=opa
opa.policy.uri=http://opa:8181/v1/data/trino/allow
opa.policy.batched-uri=http://opa:8181/v1/data/trino/batch
opa.policy.row-filters-uri=http://opa:8181/v1/data/trino/rowFilters
opa.policy.batch-column-masking-uri=http://opa:8181/v1/data/trino/batchColumnMasks
