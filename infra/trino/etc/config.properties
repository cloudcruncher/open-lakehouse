coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# TLS + JWT: every colleague and agent authenticates with a Keycloak token.
# There is no anonymous or shared "service" access for queries.
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/tls/trino.pem
http-server.authentication.type=JWT
http-server.authentication.jwt.key-file=http://keycloak:8080/realms/bank/protocol/openid-connect/certs
http-server.authentication.jwt.required-issuer=http://localhost:8280/realms/bank
http-server.authentication.jwt.required-audience=trino
http-server.authentication.jwt.principal-field=preferred_username
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}

# Guard rails so one runaway query cannot starve interactive and agent workloads.
query.max-memory=1GB
query.max-memory-per-node=768MB
query.max-execution-time=5m
query.max-queued-queries=500
