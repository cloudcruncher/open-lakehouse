connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=lakehouse
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:TRINO_POLARIS_CLIENT_ID}:${ENV:TRINO_POLARIS_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
# Trino holds no storage keys: Polaris vends short-lived credentials per table.
iceberg.rest-catalog.vended-credentials-enabled=true

fs.native-s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.region=us-east-1
s3.path-style-access=true

# Local SSD cache for hot Parquet ranges (big win for repeated agent lookups).
fs.cache.enabled=true
fs.cache.directories=/data/trino/cache
fs.cache.max-sizes=2GB

# Fail fast when storage is unhealthy: interactive and agent queries must not sit in
# long SDK retry loops. Batch engines can afford more patience; this serving engine can't.
s3.socket-connect-timeout=2s
s3.socket-timeout=10s
s3.max-error-retries=2
s3.retry-mode=STANDARD
