# Markets & Payments Intelligence (ADR 14). Reconciled by the platform; do not grant by hand.
apiVersion: open-lakehouse/v1
kind: Tenant
name: markets-data
domain: markets
description: Live market and card-authorisation streams, FX and sanctions reference data, and the gold data products built on them.
owner:
  team: Markets Data Engineering
  email: markets-data@open-lakehouse.local
  repo: https://github.com/cloudcruncher/lakehouse-markets-data
topics:
  - name: markets.coinbase.trades
    partitions: 3
    retentionHours: 168
    description: Raw trade ticks from the Coinbase WebSocket feed.
  - name: markets.payments.card-auths
    partitions: 6
    retentionHours: 168
    description: Card authorisations in many currencies (ShadowTraffic).
  - name: markets.payments.card-auths.dlq
    partitions: 1
    retentionHours: 720
    description: Card authorisations that failed schema or parsing checks.
  - name: markets.reference.fx-rates
    partitions: 1
    retentionHours: 720
    cleanupPolicy: compact
    description: Latest FX rate per currency pair (ECB via Frankfurter).
namespaces:
  - markets_bronze
  - markets_silver
  - markets_gold
# Drawn on the platform's Tenant streams dashboard (freshness, records, and lag where a topic is named).
observe:
  - { table: markets_bronze.trades, topic: markets.coinbase.trades }
  - { table: markets_bronze.card_auths, topic: markets.payments.card-auths }
  - { table: markets_silver.trades }
  - { table: markets_silver.card_auths }
  - { table: markets_bronze.fx_rates }
  - { table: markets_bronze.sanctions_targets }
  - { table: markets_silver.sanctions_names }
  - { table: markets_gold.crypto_ohlcv_1m }
  - { table: markets_gold.card_auth_daily }
  - { table: markets_gold.sanctions_hits }
secrets:
  - name: shadowtraffic
    description: ShadowTraffic licence (env file from shadowtraffic.io) for the card-authorisation generator.
codeLocation:
  image: ghcr.io/cloudcruncher/lakehouse-markets-data:0.9.0
  module: markets_data.definitions
  deploy: true    # v0.9.0 published by lakehouse-markets-data (signed, public)
  memoryMb: 1024   # idles well below this; frees room for the card-auths stream
services:
  - name: coinbase-feed
    description: Coinbase public trades (no key) to markets.coinbase.trades, keyed by product.
    image: ghcr.io/cloudcruncher/lakehouse-markets-data:0.9.0
    command: ["python3", "-m", "markets_data.coinbase"]
    memoryMb: 128   # measured 19 MiB at ~7 trades/s
    deploy: true
  - name: streams
    description: Both Kappa streams in one Spark app, trades and card authorisations to markets bronze and silver; card rejects to the .dlq topic. A catch-up every 5 minutes at laptop scale, always on at full.
    image: ghcr.io/cloudcruncher/lakehouse-markets-data:0.9.0
    command: ["python3", "-m", "markets_data.submit", "streams.py"]
    memoryMb: 1536   # one Spark driver (768m heap) for four queries; at laptop scale only during a catch-up
    stateVolume: true   # streaming checkpoints
    deploy: true
  - name: card-auths
    description: ShadowTraffic card authorisations to markets.payments.card-auths (idles without the licence).
    image: ghcr.io/cloudcruncher/lakehouse-markets-data:card-auths-0.7.0
    memoryMb: 384   # Java, heap capped at 65% by the image; ~330 MiB at ~1 record/s
    secrets: [shadowtraffic]
    deploy: true
